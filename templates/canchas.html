<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canchas Disponibles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/">🏟️ ReservaCancha</a>
<div class="collapse navbar-collapse">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
<li class="nav-item"><a class="nav-link active" href="/ui/canchas">Canchas</a></li>
<li class="nav-item"><a class="nav-link" href="/ui/reservar">Reservar</a></li>
</ul>
</div>
</div>
</nav>
<div class="container py-4">
<h1 class="mb-4"> Canchas Disponibles</h1>
<p class="text-muted mb-4">Explorá nuestras canchas y elegí la que mejor se adapte a tu deporte favorito</p>
<div class="card"><div class="card-body"><div class="row" id="canchas-grid"></div></div></div>
</div>
<script>
const API_BASE='/api/canchas';
async function loadCanchas(){
try{
const res=await fetch(API_BASE);
const data=await res.json();
const grid=document.getElementById('canchas-grid');
grid.innerHTML='';
if(data.length===0){grid.innerHTML='<div class="col-12"><p class="text-center text-muted">No hay canchas disponibles</p></div>';return;}
data.forEach(c=>{
const col=document.createElement('div');
col.className='col-md-6 col-lg-4 mb-4';
const deporteIcon={'futbol':'','fútbol':'','tenis':'','paddle':''}[c.tipo_deporte?.toLowerCase()]||'';
const superficieColor={'cesped':'bg-success','césped':'bg-success','sintetico':'bg-info','sintético':'bg-info'}[c.superficie?.toLowerCase()]||'bg-primary';
col.innerHTML=`<div class="card h-100 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between align-items-start mb-3"><h5 class="card-title mb-0">${deporteIcon} ${c.nombre}</h5>${c.tiene_iluminacion?'<span class="badge bg-warning"></span>':''}</div><div class="mb-3"><span class="badge ${superficieColor} me-2">${c.tipo_deporte||'Sin especificar'}</span><span class="badge bg-secondary">${c.superficie||'Sin especificar'}</span></div><div class="d-flex justify-content-between align-items-center"><div><h4 class="text-primary mb-0">$${c.precio_hora}</h4><small class="text-muted">por hora</small></div><a href="/ui/reservar?cancha=${c.id_cancha}" class="btn btn-primary">Reservar</a></div></div></div>`;
grid.appendChild(col);
});
}catch(error){
console.error('Error:',error);
document.getElementById('canchas-grid').innerHTML='<div class="col-12"><div class="alert alert-danger">Error al cargar las canchas</div></div>';
}
}
loadCanchas();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
