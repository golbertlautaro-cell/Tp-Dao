<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🏟️ ReservaCancha</a>
            <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="mb-4">📝 Registro de Cliente</h1>

        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Crear Nueva Cuenta</h5>
                        <form id="registro-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">DNI *</label>
                                    <input type="text" id="dni" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email *</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Nombre *</label>
                                    <input type="text" id="nombre" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellido *</label>
                                    <input type="text" id="apellido" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" id="telefono" class="form-control">
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">Registrarse</button>
                                    <button type="button" class="btn btn-secondary" id="btn-limpiar">Limpiar</button>
                                </div>
                            </div>
                        </form>
                        <div id="mensaje" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title">ℹ️ Información</h6>
                        <p class="small text-muted">Los campos marcados con * son obligatorios.</p>
                        <p class="small text-muted">Una vez registrado, podrás hacer reservas de canchas.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registro-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                dni: document.getElementById('dni').value,
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value
            };

            try {
                const response = await fetch('/api/cliente/registro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const mensajeDiv = document.getElementById('mensaje');

                if (response.ok) {
                    mensajeDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>¡Registro exitoso!</strong><br>
                            Tu ID de cliente es: ${result.cliente.id_cliente}<br>
                            <a href="/ui/reservar" class="alert-link">Hacer una reserva ahora</a>
                        </div>
                    `;
                    document.getElementById('registro-form').reset();
                } else {
                    mensajeDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('mensaje').innerHTML = `
                    <div class="alert alert-danger">
                        Error al conectar con el servidor
                    </div>
                `;
            }
        });

        document.getElementById('btn-limpiar').addEventListener('click', function() {
            document.getElementById('registro-form').reset();
            document.getElementById('mensaje').innerHTML = '';
        });
    </script>
</body>
</html>
