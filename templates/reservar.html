<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar cancha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <!-- Navbar de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">🏟️ ReservaCancha</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/ui/canchas">Canchas</a></li>
            <li class="nav-item"><a class="nav-link active" href="/ui/reservar">Reservar</a></li>
          </ul>
        </div>
      </div>
    </nav>
    
    <div class="container py-4">
      <h1 class="mb-4">Reservar Cancha</h1>

      <div class="card mb-4">
        <div class="card-body">
          <form id="reserva-form">
            <input type="hidden" id="editingId" value="">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Cliente</label>
                <!-- Campo de búsqueda para clientes: permite buscar por nombre o DNI -->
                <input type="text" id="search-cliente" class="form-control" placeholder="Buscar por nombre o DNI..." autocomplete="off" required>
                <input type="hidden" id="select-cliente" value="">
                <div id="cliente-suggestions" class="list-group" style="position:relative; z-index:1000;"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Cancha</label>
                <select id="select-cancha" class="form-select" required>
                  <option value="">Seleccionar cancha...</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Fecha</label>
                <input type="date" id="fecha" class="form-control" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Hora inicio</label>
                <select id="hora_inicio" class="form-select" required>
                  <option value="">Seleccionar hora...</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Hora fin</label>
                <input type="text" id="hora_fin" class="form-control" readonly placeholder="--:--">
              </div>

              <!-- Opción de iluminación removida del formulario de reserva -->

              <div class="col-12">
                <h5>Servicios adicionales</h5>
                <div id="servicios-list" class="d-flex gap-3 flex-wrap">
                  <!-- Checkboxes añadidos por JS -->
                </div>
              </div>

              <div class="col-12 mt-3">
                <button class="btn btn-primary" id="btn-submit">Reservar</button>
                <button type="button" class="btn btn-secondary" id="btn-reset">Limpiar</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div id="result" class="mt-3"></div>
      <div id="reservas-existentes" class="mt-4">
        <h5>Lista de reservas</h5>
        <div id="reservas-list" class="list-group"></div>
        <h6 class="mt-3">Slots disponibles (por horario definido)</h6>
        <div id="slots-list" class="d-flex gap-2 flex-wrap"></div>
      </div>
    </div>

    <script>
      const API_CLIENTES = '/api/clientes';
      const API_CANCHAS = '/api/canchas';
      const API_SERVICIOS = '/api/servicios'; // puede no existir si no hay endpoint; manejamos 404
      const API_RESERVAS = '/api/reservas';

      async function fetchJson(url){
        try{
          const res = await fetch(url);
          if(!res.ok) return null;
          return await res.json();
        }catch(e){
          return null;
        }
      }

      async function loadSelects(){
  const clientes = await fetchJson(API_CLIENTES) || [];
  // traer todas las canchas (incluye inactivas) para disponer de su metadata,
  // pero solo agregar al select las que están activas
  const canchas_all = await fetchJson(API_CANCHAS + '?all=true') || [];
        const servicios = await fetchJson(API_SERVICIOS) || [];

        // Guardar clientes en memoria y construir un mapa por id
        window._clientes = clientes;
        window._clientes_map = {};
        clientes.forEach(c=>{ window._clientes_map[c.id_cliente] = c; });

        // Inicializar búsqueda/autocomplete simple por nombre o DNI
        setupClientSearch();

        const selCancha = document.getElementById('select-cancha');
        // construir mapa y poblar solo canchas activas en el select
        window._canchas_map = {};
        canchas_all.forEach(c=>{ window._canchas_map[c.id_cancha] = c; });
        // poblar el select con etiqueta combinada: "Cancha X - deporte - superficie"
        canchas_all.filter(c=>c.activa).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id_cancha;
          const deporte = (c.tipo_deporte || '').toString();
          const sup = (c.superficie || '').toString();
          opt.textContent = `${c.nombre} - ${deporte} - ${sup}`;
          selCancha.appendChild(opt);
        });

        // cuando cambia la cancha o la fecha, recargar reservas y slots
  document.getElementById('select-cancha').addEventListener('change', onCanchaFechaChange);
  document.getElementById('fecha').addEventListener('change', onCanchaFechaChange);
  // bloquear selección de fechas pasadas: min = hoy
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fecha').setAttribute('min', today);
        // poblar select de horas de inicio (09:00 - 22:00)
        const selHora = document.getElementById('hora_inicio');
        for(let h=9; h<=22; h++){
          const hh = String(h).padStart(2,'0') + ':00';
          const opt = document.createElement('option');
          opt.value = hh;
          opt.textContent = hh;
          selHora.appendChild(opt);
        }
        // cuando cambia la hora de inicio, actualizar hora_fin automáticamente
        selHora.addEventListener('change', () => {
          const v = selHora.value;
          if(!v){ document.getElementById('hora_fin').value = '' ; return; }
          const h = parseInt(v.split(':')[0],10);
          const end = String(h+1).padStart(2,'0') + ':00';
          document.getElementById('hora_fin').value = end;
        });

        const serviciosDiv = document.getElementById('servicios-list');
        // contenedor para servicios dinámicos por deporte (se añade debajo de los servicios estáticos)
        const dynExtras = document.createElement('div');
        dynExtras.id = 'dyn-extras';
        dynExtras.className = 'd-flex gap-3 flex-wrap align-items-center';

        if(servicios.length === 0){
          serviciosDiv.innerHTML = '<small class="text-muted">No hay servicios adicionales disponibles</small>';
          serviciosDiv.appendChild(dynExtras);
        } else {
          servicios.forEach(s => {
            const id = `serv-${s.id_servicio}`;
            const wrapper = document.createElement('div');
            wrapper.className = 'form-check';
            wrapper.innerHTML = `
              <input class="form-check-input" type="checkbox" value="${s.id_servicio}" id="${id}">
              <label class="form-check-label" for="${id}">${s.nombre} ($${s.precio_adicional})</label>
            `;
            serviciosDiv.appendChild(wrapper);
          });
          serviciosDiv.appendChild(dynExtras);
        }

        // función para obtener extras por deporte
        function getExtrasForSport(tipo){
          if(!tipo) return [];
          const t = tipo.toString().toLowerCase();
          const extras = [];
          if(t.includes('hockey')){
            extras.push({nombre: 'Palo de hockey', precio: 15000, allowQuantity: true});
            extras.push({nombre: 'Bocha', precio: 3000, allowQuantity: true});
          }
          if(t.includes('tenis')){
            extras.push({nombre: 'Raqueta de tenis', precio: 15000, allowQuantity: true});
          }
          if(t.includes('pádel') || t.includes('padel') || t.includes('paddle')){
            extras.push({nombre: 'Raqueta de pádel', precio: 15000, allowQuantity: true});
          }
          if(t.includes('básquet') || t.includes('basquet') || t.includes('basket')){
            extras.push({nombre: 'Pelota de básquet', precio: 3000, allowQuantity: true});
          }
          if(t.includes('fútbol') || t.includes('futbol') || t.includes('football')){
            extras.push({nombre: 'Pelota de fútbol', precio: 3000, allowQuantity: true});
          }
          return extras;
        }
      }

      function setupClientSearch(){
        const input = document.getElementById('search-cliente');
        const hidden = document.getElementById('select-cliente');
        const suggestions = document.getElementById('cliente-suggestions');

        function renderList(items){
          suggestions.innerHTML = '';
          if(!items || items.length === 0) return;
          items.slice(0,10).forEach(c=>{
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'list-group-item list-group-item-action';
            el.style.cursor = 'pointer';
            el.textContent = `${c.nombre} ${c.apellido} (${c.dni})`;
            el.addEventListener('click', ()=>{
              input.value = `${c.nombre} ${c.apellido} (${c.dni})`;
              hidden.value = c.id_cliente;
              suggestions.innerHTML = '';
            });
            suggestions.appendChild(el);
          });
        }

        input.addEventListener('input', function(){
          const q = this.value.trim().toLowerCase();
          hidden.value = '';
          if(!q){ suggestions.innerHTML = ''; return; }
          const results = (window._clientes || []).filter(c=>{
            return (c.nombre||'').toLowerCase().includes(q) || (c.apellido||'').toLowerCase().includes(q) || (c.dni||'').toString().toLowerCase().includes(q);
          });
          renderList(results);
        });

        // close suggestions when clicking outside
        document.addEventListener('click', function(e){
          if(!suggestions.contains(e.target) && e.target !== input) suggestions.innerHTML = '';
        });
      }

      document.getElementById('reserva-form').addEventListener('submit', async function(ev){
        ev.preventDefault();
        const editingId = document.getElementById('editingId').value;
        const selectedCliente = document.getElementById('select-cliente').value;
        if(!selectedCliente){
          document.getElementById('result').innerHTML = '<div class="alert alert-warning">Por favor seleccione un cliente válido (busque por nombre o DNI).</div>';
          return;
        }
        const payload = {
          id_cliente: parseInt(document.getElementById('select-cliente').value),
          id_cancha: parseInt(document.getElementById('select-cancha').value),
          fecha_reserva: document.getElementById('fecha').value,
          hora_inicio: document.getElementById('hora_inicio').value,
          hora_fin: document.getElementById('hora_fin').value,
          servicios_adicionales: []
        };

        // procesar servicios: pueden ser ids (checkbox value) o servicios dinámicos (data-dyn)
        document.querySelectorAll('#servicios-list input[type=checkbox]:checked').forEach(cb => {
          if(cb.dataset && cb.dataset.dyn === '1'){
            const nombre = cb.dataset.nombre;
            const precio = cb.dataset.precio;
            const qtyid = cb.dataset.qtyid;
            const cantidad = (qtyid && document.getElementById(qtyid)) ? parseInt(document.getElementById(qtyid).value || '1') : 1;
            payload.servicios_adicionales.push({ nombre: nombre, precio: precio, cantidad: cantidad });
          } else {
            // checkbox value para servicios existentes
            const val = cb.value;
            if(val && !isNaN(parseInt(val,10))){
              payload.servicios_adicionales.push(parseInt(val,10));
            }
          }
        });

        const resultDiv = document.getElementById('result');
        // Si estamos editando, usar PUT y no hacer el check (el backend PUT excluye la propia reserva al validar)
        if(editingId){
          const resp = await fetch(`${API_RESERVAS}/${editingId}`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
            if(resp.ok){
              const data = await resp.json();
              resultDiv.innerHTML = `<div class="alert alert-success">Reserva actualizada. ID: ${data.id_reserva}</div>`;
              document.getElementById('editingId').value = '';
              document.getElementById('btn-submit').textContent = 'Reservar';
              this.reset();
              document.getElementById('hora_fin').value = '';
              onCanchaFechaChange();
            } else if(resp.status === 409){
              const err = await resp.json();
              resultDiv.innerHTML = `<div class="alert alert-warning">Conflicto: ${err.error}</div>`;
            } else {
              const err = await resp.json();
              resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${err.error || 'Error al actualizar la reserva'}</div>`;
            }
          return;
        }

        // antes de enviar, comprobar disponibilidad vía endpoint check (solo para creación)
        const checkUrl = `/api/reservas/check?id_cancha=${payload.id_cancha}&fecha_reserva=${payload.fecha_reserva}&hora_inicio=${payload.hora_inicio}&hora_fin=${payload.hora_fin}`;
        const check = await fetchJson(checkUrl);
        if(!check || !check.available){
          resultDiv.innerHTML = `<div class="alert alert-warning">No disponible: ${check && check.reason ? check.reason : 'ocupado o error en la validación'}</div>`;
          return;
        }

        const res = await fetch(API_RESERVAS, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        
        if(res.status === 201){
          const data = await res.json();
          const idReserva = data.reserva ? data.reserva.id_reserva : (data.id_reserva || '?');
          const precioTotal = data.precio_total || (data.reserva ? data.reserva.precio_total : '?');
          resultDiv.innerHTML = `<div class="alert alert-success">✅ ¡Reserva creada exitosamente!<br>ID de reserva: ${idReserva}<br>Precio total: $${precioTotal}</div>`;
          this.reset();
          // limpiar hora_fin y refrescar lista de reservas/slots
          document.getElementById('hora_fin').value = '';
          document.getElementById('select-cliente').value = '';
          document.getElementById('search-cliente').value = '';
          onCanchaFechaChange();
        } else if(res.status === 409){
          const err = await res.json();
          resultDiv.innerHTML = `<div class="alert alert-warning">⚠️ Conflicto: ${err.error}</div>`;
        } else {
          const err = await res.json();
          resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${err.error || 'Error al crear la reserva'}</div>`;
        }
      });

      document.getElementById('btn-reset').addEventListener('click', function(){
        document.getElementById('reserva-form').reset();
        document.getElementById('result').innerHTML = '';
        document.getElementById('editingId').value = '';
        document.getElementById('btn-submit').textContent = 'Reservar';
      });

      // Inicializar selects al cargar la página
      loadSelects();

      // --- Nuevas funciones para mostrar reservas y slots ---
      async function onCanchaFechaChange(){
        const idCancha = document.getElementById('select-cancha').value;
        const fecha = document.getElementById('fecha').value;
        // renderizar extras dinámicos según el deporte seleccionado
        const dynExtrasDiv = document.getElementById('dyn-extras');
        if(dynExtrasDiv){
          dynExtrasDiv.innerHTML = '';
          if(idCancha && window._canchas_map && window._canchas_map[idCancha]){
            const tipo = window._canchas_map[idCancha].tipo_deporte || '';
            const extras = getExtrasForSport(tipo);
            extras.forEach((ex, idx) => {
              const wrapper = document.createElement('div');
              wrapper.className = 'form-check d-flex align-items-center';
              const chkId = `dyn-ex-${idCancha}-${idx}`;
              const qtyId = `dyn-qty-${idCancha}-${idx}`;
              wrapper.innerHTML = `\n                <input class="form-check-input" type="checkbox" id="${chkId}" data-dyn="1" data-nombre="${ex.nombre}" data-precio="${ex.precio}" data-qtyid="${qtyId}">\n                <label class="form-check-label me-2" for="${chkId}">${ex.nombre} ($${ex.precio})</label>\n                <input type="number" id="${qtyId}" class="form-control form-control-sm" value="1" min="1" style="width:80px;">\n              `;
              dynExtrasDiv.appendChild(wrapper);
            });
          }
        }
        const listDiv = document.getElementById('reservas-list');
        const slotsDiv = document.getElementById('slots-list');
        listDiv.innerHTML = '';
        slotsDiv.innerHTML = '';
        if(!idCancha || !fecha) return;

        // obtener reservas existentes
        const reservas = await fetchJson(`${API_RESERVAS}?id_cancha=${idCancha}&fecha_reserva=${fecha}`) || [];

        if(reservas.length === 0){
          listDiv.innerHTML = '<div class="list-group-item text-muted">No hay reservas para la fecha seleccionada</div>';
        } else {
          reservas.forEach(r => {
            const item = document.createElement('div');
            item.className = 'list-group-item d-flex justify-content-between align-items-center';
            const left = document.createElement('div');
            left.textContent = `${r.hora_inicio} - ${r.hora_fin} — ${r.cliente_nombre || ''} ${r.cliente_apellido || ''} (ID: ${r.id_reserva})`;
            const actions = document.createElement('div');
            actions.innerHTML = `
              <button class="btn btn-sm btn-outline-primary me-2 btn-edit-res" data-id="${r.id_reserva}">Editar</button>
              <button class="btn btn-sm btn-outline-danger btn-del-res" data-id="${r.id_reserva}">Eliminar</button>
            `;
            item.appendChild(left);
            item.appendChild(actions);
            listDiv.appendChild(item);
          });
          // attach handlers
      document.querySelectorAll('.btn-edit-res').forEach(b=>b.addEventListener('click', async (ev)=>{
            const id = ev.currentTarget.dataset.id;
            const res = await fetch(`/api/reservas/${id}`);
            if(!res.ok) return alert('No se pudo cargar la reserva');
            const r = await res.json();
            document.getElementById('editingId').value = r.id_reserva;
        // set cliente hidden id and show readable text in search input
        document.getElementById('select-cliente').value = r.id_cliente;
        const cli = window._clientes_map && window._clientes_map[r.id_cliente];
        if(cli){ document.getElementById('search-cliente').value = `${cli.nombre} ${cli.apellido} (${cli.dni})`; }
        else { document.getElementById('search-cliente').value = `${r.cliente_nombre || ''} ${r.cliente_apellido || ''}`; }
            document.getElementById('select-cancha').value = r.id_cancha;
            document.getElementById('fecha').value = r.fecha_reserva;
            document.getElementById('hora_inicio').value = r.hora_inicio;
            document.getElementById('hora_fin').value = r.hora_fin;
              document.getElementById('btn-submit').textContent = 'Actualizar';
          }));
          document.querySelectorAll('.btn-del-res').forEach(b=>b.addEventListener('click', async (ev)=>{
            const id = ev.currentTarget.dataset.id;
            if(!confirm('¿Eliminar reserva?')) return;
            const resp = await fetch(`/api/reservas/${id}`, { method: 'DELETE' });
            if(!resp.ok) return alert('Error al eliminar');
            await onCanchaFechaChange();
            loadSelects();
          }));
        }

        // obtener horarios definidos para la cancha y marcar slots por hora
        const horarios = await fetchJson(`${API_CANCHAS}/${idCancha}/horarios?fecha=${fecha}`) || [];
        // construimos slots por cada horario disponible
        if(horarios.length === 0){
          // si no hay horarios definidos, usar rango por defecto 09:00-23:00
          for(let hh = 9; hh < 23; hh++){
            addSlot(hh, reservas, slotsDiv);
          }
        } else {
          for(const h of horarios){
            // solo considerar horarios que están disponibles para la fecha
            if(h.disponible_para_fecha === false) continue;
            // parsear hora y minuto
            const partsStart = h.hora_inicio.split(':');
            const partsEnd = h.hora_fin.split(':');
            let startH = parseInt(partsStart[0],10);
            const startM = parseInt(partsStart[1] || '0',10);
            const endH = parseInt(partsEnd[0],10);
            // si el inicio tiene minutos >0, redondear hacia arriba al siguiente entero
            if(startM > 0) startH = startH + 1;
            // clamp al rango 9..23
            startH = Math.max(9, startH);
            const clampEnd = Math.min(23, endH);
            for(let hh = startH; hh < clampEnd; hh++){
              addSlot(hh, reservas, slotsDiv);
            }
          }
        }
      }

      function addSlot(hh, reservas, slotsDiv){
        const slotLabel = `${String(hh).padStart(2,'0')}:00 - ${String(hh+1).padStart(2,'0')}:00`;
        const slotEl = document.createElement('button');
        slotEl.type = 'button';
        slotEl.className = 'btn btn-sm btn-outline-success';
        slotEl.textContent = slotLabel;
        // si existe reserva que cubra este slot, marcar como ocupado
        const ocupado = reservas.some(r => {
          const ri = parseInt(r.hora_inicio.split(':')[0],10);
          const rf = parseInt(r.hora_fin.split(':')[0],10);
          return (hh >= ri && hh < rf);
        });
        if(ocupado){
          slotEl.className = 'btn btn-sm btn-outline-danger disabled';
        } else {
          // al hacer click en un slot lo seleccionamos en los inputs
          slotEl.addEventListener('click', ()=>{
            document.getElementById('hora_inicio').value = `${String(hh).padStart(2,'0')}:00`;
            document.getElementById('hora_fin').value = `${String(hh+1).padStart(2,'0')}:00`;
          });
        }
        slotsDiv.appendChild(slotEl);
      }
    </script>
  </body>
</html>
